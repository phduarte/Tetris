name: .NET

on: [push, pull_request]

jobs:
  build:

    # O Desktop usa WinForms (net10.0-windows) e o som usa winmm.dll.
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Restore
      run: dotnet restore Gadz.Tetris.sln

    - name: Build
      run: dotnet build Gadz.Tetris.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test Gadz.Tetris.sln --configuration Release --no-build
